[project]
name = "sky-observer"
version = "1.0.0"
description = "Local-first AI Sky Observatory, Projected Cloud Map & Short-Term Nowcasting"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
