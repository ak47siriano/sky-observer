[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sky-observer"
version = "1.0.0"
description = "Local-first AI Sky Observatory, Projected Cloud Cover Map & Short-Term Nowcasting"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "PyYAML==6.0.4",
    "numpy>=1.26.4",
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.3.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "psutil>=6.1.0",
    "httpx>=0.28.1",
    "python-multipart==0.0.34",
    "websockets>=14.1",
]

[project.optional-dependencies]
# GPU PyTorch wheels are installed from PyTorch wheel indices (see docs/INSTALLATION.md):
#   CUDA: pip install --index-url https://download.pytorch.org/whl/cu124 torch torchvision
#   ROCm: pip install --index-url https://download.pytorch.org/whl/rocm6.2 torch torchvision
cuda = []
rocm = []
directml = ["torch-directml>=0.2.5"]
dinov3 = ["timm>=1.0.12"]
pv = ["pvlib>=0.11.0"]
mqtt = ["paho-mqtt>=2.1.0"]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.4",
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
