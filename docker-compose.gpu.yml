# Override file to enable NVIDIA Container Toolkit GPU acceleration (CUDA 12.4 wheels).
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build

services:
  sky-observer:
    build:
      args:
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cu124
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - SKYOBSERVER_DEVICE=cuda
      - SKYOBSERVER_MAX_GPU_MEMORY_FRACTION=0.85
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
