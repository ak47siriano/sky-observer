services:
  sky-observer:
    image: ${DOCKERHUB_IMAGE:-sky-observer:latest}
    container_name: sky-observer
    restart: unless-stopped
    ports:
      - "${SKYOBSERVER_HOST:-127.0.0.1}:${SKYOBSERVER_PORT:-8080}:8080"
    environment:
      - SKYOBSERVER_ENV=${SKYOBSERVER_ENV:-production}
      - SKYOBSERVER_OFFLINE_MODE=${SKYOBSERVER_OFFLINE_MODE:-true}
      - SKYOBSERVER_API_TOKEN=${SKYOBSERVER_API_TOKEN:-}
      - SKYOBSERVER_SOURCE_ALLOWLIST=${SKYOBSERVER_SOURCE_ALLOWLIST:-}
      - SKYOBSERVER_DEVICE=${SKYOBSERVER_DEVICE:-auto}
      - SKYOBSERVER_DATA_DIR=/data
      - SKYOBSERVER_CONFIG_PATH=/config/config.yaml
      - TZ=${TZ:-UTC}
    volumes:
      - ./data:/data
      - ./config:/config
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional continuous auto-update from Docker Hub (checks every 300s).
  # Keeps ./data (database, images, models, map_tiles, masks) and ./config intact.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: sky-observer-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup --label-enable
